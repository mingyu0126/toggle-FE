name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-health:
    name: Repo Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required docs
        run: |
          test -f docs/product/toggle.md
          test -f docs/architecture/toggle_erd.md
          test -f .agents/agents.md

      - name: Validate standardized enum strings
        run: |
          grep -q "USER, OWNER, ADMIN" docs/architecture/toggle_erd.md
          grep -q "PRIVATE, PUBLIC" docs/architecture/toggle_erd.md
          grep -q "STORE, MAP, USER" docs/architecture/toggle_erd.md
          grep -q "PENDING, REVIEWED, REJECTED, RESOLVED" docs/architecture/toggle_erd.md
          grep -q "TEMP_CLOSED" docs/product/toggle.md
          grep -q "EARLY_CLOSED" docs/product/toggle.md

  backend-build:
    name: Backend Build And Test
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/backend/build.gradle') != '' || hashFiles('apps/backend/build.gradle.kts') != '' }}

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run backend tests
        run: ./gradlew clean test
